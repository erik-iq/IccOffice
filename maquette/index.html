function closeModal(){document.querySelector('#modalRoot').innerHTML='';document.body.style.overflow='';document.querySelector('.app').inert=false;if(previousFocus?.isConnected)previousFocus.focus()}
const actions=label=>`<p class="form-error" id="formError" role="alert"></p><div class="modal-actions"><button class="btn" type="button" data-action="close">Annuler</button><button class="btn primary" type="submit">${label}</button></div>`;
function newOrder(client){showModal('Une nouvelle commande','Chaque belle relation commence par une attention.',`<form id="orderForm"><div class="form-grid"><div class="field full"><label for="client">Client</label><select id="client" name="client">${state.clients.map(c=>`<option value="${c.id}" ${client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label for="wine">Vin</label><select id="wine" name="wine">${state.wines.map(w=>`<option value="${w.id}">${esc(w.name)} · ${w.year} · ${number(w.stock)} bt disponibles</option>`).join('')}</select></div><div class="field"><label for="qty">Quantité en bouteilles</label><input type="number" id="qty" name="qty" min="1" max="100000" step="1" value="6" required></div><div class="field"><label for="orderDate">Date</label><input type="date" id="orderDate" name="date" value="${TODAY}" required></div></div><div class="form-total"><span>Total indicatif · TVA non calculée</span><strong id="orderTotal">${money(state.wines[0].price*6)} CHF</strong></div>${actions('Créer la commande')}</form>`)}
function orderDetail(id){const o=getOrder(id),c=getClient(o.client),w=getWine(o.wine),invoice=state.invoices.find(i=>i.order===id);showModal(esc(o.id),'Commande de démonstration',`<div class="details-grid"><p><small>Client</small>${esc(c.name)}</p><p><small>Date</small>${date(o.date)} ${o.date.slice(0,4)}</p><p><small>Livraison</small>${esc(c.city)}</p><p><small>État</small>${badge(o.status)}</p></div><table class="detail-lines"><thead><tr><th>Vin</th><th>Quantité</th><th class="money">Montant</th></tr></thead><tbody><tr><td>${esc(w.name)}<span class="subtext">Millésime ${w.year} · 75 cl</span></td><td>${o.qty} bt</td><td class="money">${money(total(o))} CHF</td></tr></tbody></table><p class="invoice-note">Le stock en bouteilles est débité au passage à l’état « Livrée ». Aucun document officiel n’est émis.</p><div class="modal-actions">${o.status==='À préparer'?`<button class="btn primary" data-action="prepare" data-id="${id}">Commencer la préparation</button>`:o.status==='En préparation'?`<button class="btn primary" data-action="deliver" data-id="${id}">Confirmer la livraison</button>`:invoice?`<button class="btn primary" data-action="invoice-detail" data-id="${invoice.id}">Voir la facture</button>`:`<button class="btn primary" data-action="make-invoice" data-id="${id}">Créer la facture de démo</button>`}</div>`)}
function newClient(){showModal('Une belle rencontre','Créez une fiche pour votre nouveau client.',`<form id="clientForm"><div class="form-grid"><div class="field full"><label for="clientName">Nom du client ou de l’établissement</label><input id="clientName" name="name" maxlength="100" required placeholder="Ex. Restaurant Le Jardin"></div><div class="field"><label for="contact">Personne de contact</label><input id="contact" name="contact" maxlength="80" required></div><div class="field"><label for="city">Ville</label><input id="city" name="city" maxlength="80" required></div><div class="field full"><label for="email">E-mail fictif</label><input id="email" name="email" type="email" maxlength="120" required placeholder="contact@example.com"></div><div class="field full"><label for="clientType">Type de client</label><select id="clientType" name="type"><option>Particulier</option><option>Restaurant</option><option>Revendeur</option><option>Hôtel</option></select></div></div>${actions('Créer le client')}</form>`)}
function clientDetail(id){const c=getClient(id),os=state.orders.filter(o=>o.client===id);showModal(esc(c.name),'La relation client, en un regard.',`<div class="details-grid"><p><small>Contact</small>${esc(c.contact)}</p><p><small>Ville</small>${esc(c.city)}</p><p><small>E-mail</small>${esc(c.email)}</p><p><small>Profil</small>${badge(c.type)}</p></div><table class="detail-lines"><thead><tr><th>Commande</th><th>Statut</th><th class="money">Montant</th></tr></thead><tbody>${os.map(o=>`<tr><td>${o.id}</td><td>${badge(o.status)}</td><td class="money">${money(total(o))} CHF</td></tr>`).join('')||'<tr><td colspan="3">La première commande reste à écrire.</td></tr>'}</tbody></table><div class="modal-actions"><button class="btn primary" data-action="new-client-order" data-id="${id}">${icon('plus')}Créer une commande</button></div>`)}
function newMovement(){showModal('La cave évolue','Enregistrer un mouvement fictif, en toute clarté.',`<form id="movementForm"><div class="form-grid"><div class="field full"><label for="lot">Lot concerné</label><select id="lot" name="lot">${state.lots.map(l=>`<option value="${l.id}">${l.id} · ${esc(l.name)} ${l.year} · ${number(l.volume)} L</option>`).join('')}</select></div><div class="field full"><label for="movementType">Opération</label><select id="movementType" name="type"><option value="entry">Entrée de vrac (litres)</option><option value="out">Sortie de vrac (litres)</option><option value="bottling">Mise en bouteilles de 75 cl (nombre de bouteilles)</option></select></div><div class="field full"><label for="movementQty" id="movementQtyLabel">Volume en litres</label><input id="movementQty" name="qty" type="number" min="0.01" step="0.01" max="100000" required value="100"></div></div><p class="invoice-note" id="movementHelp">Le mouvement actualise le solde en vrac du lot choisi.</p>${actions('Enregistrer le mouvement')}</form>`)}
function invoiceDetail(id){const i=state.invoices.find(i=>i.id===id),o=getOrder(i.order),c=getClient(o.client),w=getWine(o.wine);showModal(esc(id),'Aperçu de démonstration — ne constitue pas une facture.',`<div class="details-grid"><p><small>Émetteur fictif</small>Domaine de la Belle Saison</p><p><small>Client</small>${esc(c.name)}<br>${esc(c.city)}</p><p><small>Commande</small>${o.id}</p><p><small>Échéance</small>${date(i.due)} ${i.due.slice(0,4)}</p></div><table class="detail-lines"><thead><tr><th>Désignation</th><th>Quantité</th><th class="money">Montant</th></tr></thead><tbody><tr><td>${esc(w.name)} ${w.year}</td><td>${o.qty} bt</td><td class="money">${money(total(o))} CHF</td></tr></tbody></table><div class="form-total"><span>Montant indicatif</span><strong>${money(total(o))} CHF</strong></div><p class="invoice-note">TVA non calculée · coordonnées bancaires non renseignées · aucun QR de paiement. ${i.paid?'Règlement fictif enregistré.':'Aucun règlement réel attendu.'}</p><div class="modal-actions"><button class="btn" data-action="print">${icon('print')}Imprimer l’aperçu</button>${i.paid?'':`<button class="btn primary" data-action="pay" data-id="${id}">Marquer réglée</button>`}</div>`)}
function exportCSV(){let rows,name=view;if(view==='clients')rows=[['Client','Contact','Ville','E-mail','Type'],...state.clients.map(c=>[c.name,c.contact,c.city,c.email,c.type])];else if(view==='catalog')rows=[['Vin','Millésime','Couleur','Stock bouteilles','Prix indicatif CHF'],...state.wines.map(w=>[w.name,w.year,w.color,w.stock,w.price])];else if(view==='cave')rows=[['Référence','Date','Lot','Opération','Quantité','Unité'],...state.movements.map(m=>[m.id,m.date,m.lot,m.type,m.qty,m.unit])];else if(view==='invoices')rows=[['Facture','Commande','Client','Échéance','Statut','Montant indicatif CHF'],...state.invoices.map(i=>{const o=getOrder(i.order);return [i.id,o.id,getClient(o.client).name,i.due,invoiceStatus(i),total(o)]})];else rows=[['Commande','Client','Vin','Quantité','Date','Statut','Montant indicatif CHF'],...state.orders.map(o=>[o.id,getClient(o.client).name,getWine(o.wine).name,o.qty,o.date,o.status,total(o)])];const csv='\uFEFF'+rows.map(r=>r.map(v=>{let s=String(v);if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='cuvee-demo-'+name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Export CSV téléchargé — toutes les données de cette rubrique. Le filtre n’est pas appliqué.')}
function closeMobile(){document.querySelector('#sidebar').classList.remove('open');document.querySelector('#mobileBackdrop').classList.remove('open');document.querySelector('#menuToggle').setAttribute('aria-expanded','false')}
function notification(){const old=document.querySelector('.notification-panel');if(old){old.remove();document.querySelector('#notifications').setAttribute('aria-expanded','false');return}const overdue=state.invoices.filter(i=>!i.paid&&i.due<TODAY).length;document.querySelector('.topbar').insertAdjacentHTML('beforeend',`<section class="notification-panel" aria-label="Points d’attention"><h3>Un instant pour faire le point.</h3><p>${state.orders.filter(o=>o.status!=='Livrée').length} commandes à traiter.</p><p>${overdue} facture(s) échue(s) non réglée(s).</p><small>Situation fictive au 16 octobre 2026.</small></section>`);document.querySelector('#notifications').setAttribute('aria-expanded','true')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){document.querySelector('.notification-panel')?.remove();document.querySelector('#notifications').setAttribute('aria-expanded','false');navigate(nav.dataset.view);return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const target=e.target.closest('[data-action]');if(!target)return;const {action,id}=target.dataset;switch(action){case 'new-order':newOrder();break;case 'new-client-order':closeModal();newOrder(id);break;case 'close':closeModal();break;case 'new-client':newClient();break;case 'client-detail':clientDetail(id);break;case 'order-detail':orderDetail(id);break;case 'invoice-detail':invoiceDetail(id);break;case 'new-movement':newMovement();break;case 'export':exportCSV();break;case 'go-orders':navigate('orders');break;case 'low-stock':navigate('catalog');filter='Stock bas';render();break;case 'overdue':navigate('invoices');filter='En retard';render();break;case 'prepare':getOrder(id).status='En préparation';save();closeModal();render();toast('La préparation de la commande peut commencer.');break;case 'deliver':{const o=getOrder(id),w=getWine(o.wine);if(w.stock<o.qty){toast('Stock insuffisant pour confirmer cette livraison.');break}if(o.status==='Livrée')break;w.stock-=o.qty;o.status='Livrée';save();closeModal();render();toast('Livraison enregistrée et stock en bouteilles actualisé.');break}case 'make-invoice':{if(state.invoices.some(i=>i.order===id))break;const n=Math.max(...state.invoices.map(i=>+i.id.split('-').at(-1)),0)+1;const dueDate=new Date(getOrder(id).date+'T12:00:00Z');dueDate.setUTCDate(dueDate.getUTCDate()+30);state.invoices.push({id:'FAC-2026-'+String(n).padStart(3,'0'),order:id,due:dueDate.toISOString().slice(0,10),paid:false});save();closeModal();render();toast('Facture de démonstration créée.');break}case 'pay':{const i=state.invoices.find(i=>i.id===id);i.paid=true;save();closeModal();render();toast('Règlement fictif enregistré.');break}case 'print':window.print();break;case 'reset':showModal('Repartir d’une page blanche ?','Les données initiales de la maquette seront restaurées.',`<p class="invoice-note">Les clients, commandes et mouvements ajoutés dans cette démonstration seront supprimés de ce navigateur.</p><div class="modal-actions"><button class="btn" data-action="close">Conserver mes essais</button><button class="btn primary" data-action="confirm-reset">Réinitialiser la démo</button></div>`);break;case 'confirm-reset':state=structuredClone(initial);save();closeModal();navigate('dashboard');toast('La démonstration a retrouvé ses données initiales.');break}});
document.addEventListener('submit',e=>{if(!['orderForm','clientForm','movementForm'].includes(e.target.id))return;e.preventDefault();const fd=new FormData(e.target),error=document.querySelector('#formError');if(e.target.id==='orderForm'){const qty=+fd.get('qty'),w=getWine(fd.get('wine'));if(!Number.isSafeInteger(qty)||qty<=0||qty>w.stock){error.textContent='Indiquez un nombre entier de bouteilles, dans la limite du stock disponible.';return}const reserved=state.orders.filter(o=>o.wine===w.id&&o.status!=='Livrée').reduce((s,o)=>s+o.qty,0);if(qty>w.stock-reserved){error.textContent=`Quantité disponible après commandes en cours : ${Math.max(0,w.stock-reserved)} bouteilles.`;return}const n=Math.max(...state.orders.map(o=>+o.id.split('-')[1]),1048)+1;state.orders.unshift({id:'CMD-'+n,client:fd.get('client'),wine:w.id,qty,date:fd.get('date'),status:'À préparer',unitPrice:w.price});save();closeModal();render();toast('Nouvelle commande enregistrée.')}else if(e.target.id==='clientForm'){const data=Object.fromEntries(fd);for(const k of ['name','contact','city','email'])data[k]=data[k].trim();if(!data.name||!data.contact||!data.city||!data.email){error.textContent='Complétez les champs avec des informations valides.';return}state.clients.push({id:'c'+Date.now(),...data});save();closeModal();render();toast('Le nouveau client a rejoint votre carnet.')}else{const lot=state.lots.find(l=>l.id===fd.get('lot')),qty=+fd.get('qty'),type=fd.get('type');if(!Number.isFinite(qty)||qty<=0||(type==='bottling'&&!Number.isInteger(qty))){error.textContent='Indiquez une quantité positive et des bouteilles entières pour une mise.';return}const volume=type==='bottling'?qty*.75:qty;if(type!=='entry'&&volume>lot.volume){error.textContent=`Volume insuffisant. Ce lot contient ${number(lot.volume)} litres.`;return}lot.volume=Math.round((lot.volume+(type==='entry'?volume:-volume))*100)/100;if(type==='bottling'){const w=getWine(lot.wine);if(w.year!==lot.year){const linked=state.wines.find(x=>x.year===lot.year&&x.name===w.name);if(linked)linked.stock+=qty;else state.wines.push({...w,id:'w'+Date.now(),year:lot.year,stock:qty})}else w.stock+=qty}state.movements.push({id:'MVT-'+String(state.movements.length+1).padStart(3,'0'),lot:lot.id,type:type==='entry'?'Entrée de vrac':type==='out'?'Sortie de vrac':'Mise en bouteilles (75 cl)',qty,unit:type==='bottling'?'bt':'L',date:TODAY});save();closeModal();render();toast('Mouvement enregistré et soldes actualisés.')}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch'||e.target.id==='localSearch'){query=e.target.value;const global=e.target.id==='globalSearch',start=e.target.selectionStart;render();if(global)document.querySelector('#globalSearch').value=query;else{const field=document.querySelector('#localSearch');field.focus();field.setSelectionRange(start,start);document.querySelector('#globalSearch').value=query}}if(e.target.closest('#orderForm')){const form=document.querySelector('#orderForm'),w=getWine(form.elements.wine.value),qty=+form.elements.qty.value;document.querySelector('#orderTotal').textContent=money(Math.max(0,qty)*w.price)+' CHF'}});
document.addEventListener('change',e=>{if(e.target.id==='period'){period=e.target.value;render()}if(e.target.id==='movementType'){const bottles=e.target.value==='bottling',input=document.querySelector('#movementQty');document.querySelector('#movementQtyLabel').textContent=bottles?'Nombre de bouteilles de 75 cl':'Volume en litres';input.step=bottles?'1':'.01';input.min=bottles?'1':'.01';document.querySelector('#movementHelp').textContent=bottles?'La mise retire 0,75 litre par bouteille du lot et ajoute les bouteilles au bon millésime du catalogue.':'Le mouvement actualise le solde en vrac du lot choisi.'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.modal'))closeModal();closeMobile();document.querySelector('.notification-panel')?.remove();document.querySelector('#notifications').setAttribute('aria-expanded','false')}if(e.key==='Tab'&&document.querySelector('.modal')){const els=[...document.querySelector('.modal').querySelectorAll('button,input,select,a[href]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
document.querySelector('#menuToggle').innerHTML=icon('menu');document.querySelector('#domainIcon').innerHTML=icon('leaf');document.querySelector('#searchIcon').innerHTML=icon('search');document.querySelector('#notifications').innerHTML=icon('bell')+'<i class="notification-dot"></i>';
document.querySelector('#notifications').addEventListener('click',notification);document.querySelector('#menuToggle').addEventListener('click',()=>{const open=document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#mobileBackdrop').classList.toggle('open',open);document.querySelector('#menuToggle').setAttribute('aria-expanded',String(open))});document.querySelector('#mobileBackdrop').addEventListener('click',closeMobile);render();
</script>
</body></html>
